# 网站基础配置 / Site configuration
baseURL: 'https://haiyangzhang-lab.com/'
title: 'Haiyang Zhang'
defaultContentLanguage: en
defaultContentLanguageInSubdir: false   # 英文在 /，中文在 /zh/
hasCJKLanguage: true
enableRobotsTXT: true
summaryLength: 40
# blogdown：Hugo 忽略 R Markdown 源文件，只读取 knit 生成的 .html / .markdown
ignoreFiles: ['\.Rmd$', '\.Rmarkdown$', '_cache$', '\.knit\.md$', '\.utf8\.md$']
markup:
  goldmark:
    renderer:
      unsafe: true          # 允许在 Markdown 中写 HTML
    extensions:
      passthrough:          # 数学公式 $...$ / $$...$$ 原样保留给 KaTeX
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['$', '$'], ['\(', '\)']]
  highlight:
    noClasses: true
    style: github
taxonomies: {}
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
imaging:
  quality: 85
  resampleFilter: lanczos
