# 自定义字体包：只用系统字体，不请求 Google Fonts（国内访问更快）
# 标题用衬线体（Mac 上中文显示为宋体），正文用无衬线体（Mac 上中文显示为苹方）
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Academic CN"
    vendor: "custom"
    version: "1.0.0"
    license: "MIT"
    style: "serif"
    description: "System fonts only, no external requests"
  families:
    heading: "system-serif"
    body: "system-sans"
    code: "system-mono"
  weights:
    heading: [600, 700]
    body: [400, 600]
    code: [400]
  leading:
    heading: 1.3
    body: 1.75
    code: 1.5
  tracking:
    heading: "0"
    body: "0"
