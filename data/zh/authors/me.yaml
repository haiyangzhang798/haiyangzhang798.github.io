name: 张海洋
alt_name: Haiyang Zhang
role: 教授、博士生导师
affiliation:
  name: 河北大学生命科学学院
  url: https://smkxxy.hbu.cn/info/1099/4203.htm

bio: |
  张海洋，河北大学生命科学学院教授、博士生导师，研究方向为微生物生态学与菌根生态学。

  主要关注**丛枝菌根真菌**、根瘤菌等植物共生微生物如何影响植物养分获取、群落构建，以及氮沉降、干旱和增温等全球变化背景下草地生态系统的**碳氮循环**。研究结合内蒙古草原长期野外控制实验、温室实验、同位素示踪以及基因组大小等功能性状方法，连接微生物性状与生态系统功能。

  加入河北大学之前，曾在德国马普生物地球化学研究所和澳大利亚西悉尼大学从事研究工作。

