bio: |
  Haiyang studies the hidden half of grassland ecosystems. He is interested in how
  **arbuscular mycorrhizal fungi**, rhizobia and other plant symbionts shape plant
  nutrition, community assembly and the cycling of **carbon and nitrogen** under global
  change — nitrogen deposition, drought and warming.

  His work combines long-term field experiments in the Inner Mongolia steppe, glasshouse
  experiments, isotope tracing and trait-based approaches such as genome size to link
  microbial traits to ecosystem functions.

  He is now a Professor at the School of Life Sciences, Hebei University, after research
  positions at the Max Planck Institute for Biogeochemistry and Western Sydney University.

interests:
  - Arbuscular mycorrhizal fungi
  - Plant–microbe symbiosis
  - Microbial & plant functional traits
  - Grassland carbon and nutrient cycling

